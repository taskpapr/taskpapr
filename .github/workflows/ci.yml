name: CI

on:
  push:
    branches: ["main"]
  # No branch filter: stacked PRs (feature → feature) must run CI too,
  # not just PRs targeting main. Explicit types add labeled/unlabeled to the
  # opened/synchronize/reopened default, so adding the version-bump-check's
  # 'no-version-bump' exemption label after opening a PR actually re-runs
  # the check instead of leaving a stale failure sitting there.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  version-bump-check:
    name: Version bump check
    runs-on: ubuntu-latest
    # Only PRs actually landing on staging/main — not every feature->feature
    # stacked PR in between, which may legitimately not have bumped yet.
    if: >
      github.event_name == 'pull_request' &&
      (github.event.pull_request.base.ref == 'staging' || github.event.pull_request.base.ref == 'main')
    steps:
      - uses: actions/checkout@v4

      - name: Fetch base branch
        run: git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1

      - name: Compare package.json version against base branch
        env:
          HAS_SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-version-bump') }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$HAS_SKIP_LABEL" = "true" ]; then
            echo "Skipped — 'no-version-bump' label present."
            exit 0
          fi
          BASE_VERSION=$(git show "origin/$BASE_REF:package.json" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          HEAD_VERSION=$(node -p "require('./package.json').version")
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::package.json version ($HEAD_VERSION) is unchanged from '$BASE_REF'. Every PR into staging/main should bump the patch version — run 'npm version patch --no-git-tag-version' and commit it. If this PR genuinely doesn't warrant one (docs-only, CI-only, test-only changes), add the 'no-version-bump' label to skip this check."
            exit 1
          fi
          echo "Version bumped: $BASE_VERSION -> $HEAD_VERSION"

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest

    # Stripe credentials. STRIPE_TEST_SECRET_KEY is a dedicated Stripe TEST
    # MODE key (repo secret) used for the live webhook integration test below
    # — it's empty for external contributor PRs (forks don't get secrets), so
    # STRIPE_SECRET_KEY falls back to a dummy value. Either way the server
    # boots with stripe != null, which matters: without ANY key, server.js
    # boots with stripe = null and /api/stripe/webhook short-circuits before
    # ever verifying a signature — exactly how the v0.45.1 body-parser-
    # ordering bug shipped undetected, since that code path was structurally
    # untested. constructEvent() itself is pure local HMAC verification, so
    # the dummy fallback is sufficient for the signature-only test.
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY || 'sk_test_dummy_for_ci' }}
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy_for_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start server (background)
        run: |
          node server.js &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for the server to be ready (up to 15s)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3033/api/me > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests
        run: bash test/smoke.sh http://localhost:3033

      - name: Run bookmarks migration test
        run: node test/migration-bookmarks.js

      - name: Run checkout customer-params test
        run: node test/checkout-customer-params.js

      - name: Run API integration tests
        run: bash test/integration-api.sh http://localhost:3033

      - name: Run Stripe webhook signature test
        run: bash test/webhook-billing.sh http://localhost:3033

      - name: Run Stripe webhook live integration test
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: bash test/webhook-billing-live.sh http://localhost:3033

      - name: npm audit (high/critical fail CI)
        run: npm audit --audit-level=high

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  smoke-test-postgres:
    name: Smoke test (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskpapr
          POSTGRES_PASSWORD: taskpapr
          POSTGRES_DB: taskpapr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://taskpapr:taskpapr@localhost:5432/taskpapr
      # Dummy Stripe credentials — see smoke-test job above for why.
      STRIPE_SECRET_KEY: sk_test_dummy_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_test_dummy_for_ci

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run schema migration
        run: node db-migrate.js

      - name: Start server (background)
        run: |
          node server.js &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          # Wait for the server to be ready (up to 15s)
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3033/api/me > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests
        run: bash test/smoke.sh http://localhost:3033

      - name: Run API integration tests
        run: bash test/integration-api.sh http://localhost:3033

      - name: Run Stripe webhook signature test
        run: bash test/webhook-billing.sh http://localhost:3033

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [smoke-test, smoke-test-postgres]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (amd64 only for PR/push — multi-arch on release)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: taskpapr:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [smoke-test, smoke-test-postgres]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history/tags, not the default shallow clone

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/taskpapr:latest
            ghcr.io/${{ github.repository_owner }}/taskpapr:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release
        # Runs after the image is actually published — don't tag a version
        # that failed to build/push. Idempotent: if this same version's tag
        # already exists (e.g. a re-run), skip rather than fail the job.
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists, skipping."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi